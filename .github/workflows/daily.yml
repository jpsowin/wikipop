name: Daily WikiPop Update

on:
  schedule:
    # Runs at 6:00 AM UTC daily (1-2 AM Eastern, after Wikipedia daily stats finalize)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and build
        run: |
          node scripts/build.js
          node scripts/build-explore.js

      - name: Send daily email
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: node scripts/send-email.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/articles.json data/featured-index.json index.html archive.html explore.html featured.html feed.xml
          git diff --staged --quiet || git commit -m "Daily update: $(date -u +%Y-%m-%d)"
          git push
