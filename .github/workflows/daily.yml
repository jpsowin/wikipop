name: Daily WikiPop Update

on:
  schedule:
    # Runs at 7:30 AM UTC daily (2:30-3:30 AM Eastern). Shifted later from 6:00
    # because Wikimedia's pageview publish time for "yesterday" isn't guaranteed
    # — 06:00 was on the edge and occasionally hit 404s.
    - cron: '30 7 * * *'
  workflow_dispatch: # Allow manual trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch and build
        run: |
          node scripts/build.js --backfill 3
          node scripts/build-explore.js

      - name: Send daily email
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: node scripts/send-email.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/articles.json data/featured-index.json index.html archive.html explore.html featured.html changelog.html feed.xml sitemap.xml llms-full.txt day/
          git add data/last-email.txt || true
          git diff --staged --quiet || git commit -m "Daily update: $(date -u +%Y-%m-%d)"
          git push
