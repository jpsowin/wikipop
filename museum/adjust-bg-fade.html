<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gradient Fade Playground</title>
  <style>
    :root {
      --red: #d00d00;
      --yellow: #ffdf00;
      --dot-size: 5px;
      --dot-spacing-x: 19px;
      --dot-spacing-y: 28.5px;
      --active-gradient: linear-gradient(to right, transparent, transparent);
    }

    body {
      margin: 0;
      font-family: -apple-system, sans-serif;
      background-color: var(--yellow);
      background-image: 
        var(--active-gradient),
        radial-gradient(circle, var(--red) var(--dot-size), transparent calc(var(--dot-size) + 0.5px)),
        radial-gradient(circle, var(--red) var(--dot-size), transparent calc(var(--dot-size) + 0.5px));
      background-size: 100% 100%, var(--dot-spacing-x) var(--dot-spacing-y), var(--dot-spacing-x) var(--dot-spacing-y);
      background-position: center, 0 0, calc(var(--dot-spacing-x) / 2) calc(var(--dot-spacing-y) / 2);
      min-height: 100vh;
    }

    .content-area {
      max-width: 760px;
      margin: 0 auto;
      min-height: 100vh;
      border-left: 2px dashed rgba(0,0,0,0.2);
      border-right: 2px dashed rgba(0,0,0,0.2);
      padding-top: 4rem;
    }

    .controls {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      border: 3px solid #111;
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 4px 4px 0 #111;
      width: 450px;
      z-index: 100;
    }

    .controls h2 {
      margin: 0 0 1rem;
      font-size: 1.2rem;
      text-align: center;
    }

    .slider-group {
      margin-bottom: 1.5rem;
    }

    .slider-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.5rem;
      font-weight: 600;
      font-size: 0.9rem;
    }

    input[type=range] {
      width: 100%;
      accent-color: var(--red);
    }

    .hint {
      font-size: 0.8rem;
      color: #666;
      margin-top: 0.2rem;
      line-height: 1.3;
    }

    .css-output {
      margin-top: 1.5rem;
      background: #f4f4f4;
      padding: 0.75rem;
      border: 1px solid #ccc;
      font-family: monospace;
      font-size: 0.75rem;
      border-radius: 4px;
      cursor: pointer;
      white-space: pre-wrap;
      max-height: 150px;
      overflow-y: auto;
    }
    
    .css-output:active {
      background: #e0e0e0;
    }
  </style>
</head>
<body>

  <div class="content-area">
    <div style="text-align:center; opacity:0.5; font-weight:bold; margin-top: 20vh;">
      760px Content Area (dashed lines)
    </div>
  </div>

  <div class="controls">
    <h2>Adjust Background Fade</h2>
    
    <div class="slider-group">
      <label>
        Fade Start (Inner edge)
        <span id="start-val">380px</span>
      </label>
      <input type="range" id="fade-start" min="200" max="800" value="380">
      <div class="hint">Distance from center where dots are fully visible.</div>
    </div>

    <div class="slider-group">
      <label>
        Fade End (Outer edge)
        <span id="end-val">700px</span>
      </label>
      <input type="range" id="fade-end" min="300" max="1500" value="700">
      <div class="hint">Distance from center where it's solid yellow.</div>
    </div>

    <div class="slider-group">
      <label>
        Fade Curve (Easing)
        <span id="curve-val">0.5</span>
      </label>
      <input type="range" id="fade-curve" min="0.1" max="3.0" step="0.1" value="0.5">
      <div class="hint">
        <b>&lt; 1:</b> Fades out quickly at first, then slowly blends out.<br>
        <b>1:</b> Linear even fade.<br>
        <b>&gt; 1:</b> Stays mostly transparent, then fades abruptly at the end.
      </div>
    </div>

    <div class="css-output" id="css-out" title="Click to copy"></div>
  </div>

  <script>
    const root = document.documentElement;
    const startSlider = document.getElementById('fade-start');
    const endSlider = document.getElementById('fade-end');
    const curveSlider = document.getElementById('fade-curve');
    
    const startVal = document.getElementById('start-val');
    const endVal = document.getElementById('end-val');
    const curveVal = document.getElementById('curve-val');
    
    const cssOut = document.getElementById('css-out');

    function update() {
      let start = parseInt(startSlider.value);
      let end = parseInt(endSlider.value);
      const curve = parseFloat(curveSlider.value);

      if (start > end) {
        end = start;
        endSlider.value = end;
      }

      startVal.textContent = `${start}px`;
      endVal.textContent = `${end}px`;
      curveVal.textContent = curve.toFixed(1);

      const steps = 10;
      let leftStops = [];
      let rightStops = [];

      for (let i = 1; i <= steps - 1; i++) {
        const t = i / steps;
        const opacity = Math.pow(t, curve).toFixed(3);
        const distPx = start + (end - start) * t;
        
        leftStops.unshift(`rgba(255, 223, 0, ${opacity}) calc(50% - ${distPx}px)`);
        rightStops.push(`rgba(255, 223, 0, ${opacity}) calc(50% + ${distPx}px)`);
      }

      const code = `linear-gradient(to right,\n  #ffdf00 0%,\n  #ffdf00 calc(50% - ${end}px),\n  ${leftStops.join(',\\n  ')},\n  rgba(255, 223, 0, 0) calc(50% - ${start}px),\n  rgba(255, 223, 0, 0) calc(50% + ${start}px),\n  ${rightStops.join(',\\n  ')},\n  #ffdf00 calc(50% + ${end}px),\n  #ffdf00 100%\n)`;
      
      // Update background with actual line breaks for the CSS variable
      root.style.setProperty('--active-gradient', code.replace(/\\n/g, '\n'));
      
      // Show string without the escape backslashes in the output box
      cssOut.textContent = code.replace(/\\n/g, '\n');
    }

    startSlider.addEventListener('input', update);
    endSlider.addEventListener('input', update);
    curveSlider.addEventListener('input', update);

    cssOut.addEventListener('click', () => {
      navigator.clipboard.writeText(cssOut.textContent);
      const original = cssOut.textContent;
      cssOut.textContent = 'Copied!';
      setTimeout(() => cssOut.textContent = original, 1000);
    });

    update();
  </script>

</body>
</html>
